# Deploy SMTP Proxy to Fly.io (free tier, no terminal needed)
#
# This workflow auto-deploys the smtp-proxy/ service to Fly.io whenever you
# push to main. The proxy runs the real SMTP mailbox verification on port 25
# (which Fly.io allows but Render doesn't).
#
# ONE-TIME SETUP (browser-only, ~5 minutes):
#   1. Sign up at https://fly.io (free, no credit card charge within free tier)
#   2. Go to https://fly.io/dashboard and click "Create App"
#      - Name: cold-outreach-smtp-proxy (or any unique name)
#      - Region: iad (US East) — closest to most email servers
#      - Click "Create App" (DO NOT deploy yet — we deploy via this GitHub Action)
#   3. Go to https://fly.io/app/cold-outreach-smtp-proxy/secrets
#      - Add secret: PROXY_SECRET = <a long random string you generate>
#        (use https://www.allkeysgenerator.com — 256-bit hex)
#      - Add secret: VERIFICATION_DOMAIN = <your domain, e.g. verify.yourdomain.com>
#        (optional — leave empty to use empty MAIL FROM which is RFC-compliant)
#   4. Go to https://fly.io/user/personal_access_tokens
#      - Generate a new token, copy it
#   5. Go to your GitHub repo → Settings → Secrets and variables → Actions
#      - Click "New repository secret"
#      - Name: FLY_API_TOKEN
#      - Value: paste the token from step 4
#      - Also add: PROXY_URL = https://cold-outreach-smtp-proxy.fly.dev
#        (replace cold-outreach-smtp-proxy with your actual app name)
#   6. Update fly.toml in this folder: change `app = "..."` to match your app name
#   7. Push to GitHub — this workflow will deploy automatically
#
# AFTER DEPLOY:
#   - On Render (main backend), set env var:
#       SMTP_PROXY_URL = https://cold-outreach-smtp-proxy.fly.dev
#       SMTP_PROXY_SECRET = <same PROXY_SECRET you set on Fly.io>
#   - Redeploy the main backend
#   - Verification now uses the proxy for SMTP checks — 100% free

name: Deploy SMTP Proxy to Fly.io

on:
  push:
    branches: [main]
    paths:
      - 'smtp-proxy/**'
      - '.github/workflows/deploy-proxy.yml'
  workflow_dispatch:  # allow manual trigger from GitHub Actions tab

jobs:
  deploy:
    name: Deploy proxy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smtp-proxy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Show app status
        run: flyctl status
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
